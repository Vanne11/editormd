[package]
name = "editormd"
version = "0.1.0"
description = "EditorMD - Gestor de Notas Personal"
authors = ["vanne"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
walkdir = "2"
base64 = "0.22"
pulldown-cmark = "0.13"
genpdf = "0.2"
docx-rs = "0.4"
html2md = "0.2"
